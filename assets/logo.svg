<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="IEP Ready Kit logo">
  <style>
    /* Plays once. The finished state is the default, so it is complete without animation. */
    .tick{stroke-dasharray:44;stroke-dashoffset:0}
    .dot{opacity:1}
    @media (prefers-reduced-motion:no-preference){
      .tick{animation:draw .55s ease-out .25s both}
      .dot{animation:fade .3s ease-out .8s both}
    }
    @keyframes draw{from{stroke-dashoffset:44}to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  </style>
  <rect width="64" height="64" rx="15" fill="#1F3A5F"/>
  <rect x="15" y="12" width="34" height="40" rx="5" fill="#fff"/>
  <path class="tick" d="M22 32l7 7 13-15" fill="none" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="dot" cx="47" cy="17" r="5" fill="#F2A65A"/>
</svg>
