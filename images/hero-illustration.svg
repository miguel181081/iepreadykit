<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-labelledby="t">
  <title id="t">Illustration of a navy binder, a printed checklist and a question card on a table</title>
  <rect width="480" height="400" rx="28" fill="#E3ECF5"/>
  <circle cx="400" cy="70" r="38" fill="#FBE3C2"/>
  <rect x="40" y="330" width="400" height="14" rx="7" fill="#C5D4E4"/>
  <!-- checklist paper -->
  <g transform="rotate(-6 120 220)">
    <rect x="52" y="108" width="170" height="220" rx="10" fill="#fff" stroke="#B8C8DA" stroke-width="2"/>
    <rect x="72" y="130" width="90" height="10" rx="5" fill="#1F3A5F"/>
    <g fill="none" stroke="#0F6B3F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M74 170l6 6 12-13"/><path d="M74 206l6 6 12-13"/><path d="M74 242l6 6 12-13"/>
    </g>
    <rect x="104" y="168" width="96" height="8" rx="4" fill="#C5D4E4"/>
    <rect x="104" y="204" width="80" height="8" rx="4" fill="#C5D4E4"/>
    <rect x="104" y="240" width="90" height="8" rx="4" fill="#C5D4E4"/>
    <rect x="74" y="274" width="16" height="16" rx="4" fill="none" stroke="#1F3A5F" stroke-width="2.5"/>
    <rect x="104" y="278" width="70" height="8" rx="4" fill="#C5D4E4"/>
  </g>
  <!-- binder -->
  <g transform="rotate(3 300 210)">
    <rect x="190" y="70" width="200" height="260" rx="14" fill="#1F3A5F"/>
    <rect x="190" y="70" width="22" height="260" rx="10" fill="#17304F"/>
    <g fill="#E3ECF5"><circle cx="201" cy="120" r="6"/><circle cx="201" cy="200" r="6"/><circle cx="201" cy="280" r="6"/></g>
    <rect x="236" y="130" width="120" height="86" rx="10" fill="#fff"/>
    <text x="296" y="166" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="700" fill="#46566A">IEP READY KIT</text>
    <text x="296" y="190" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="800" fill="#1F3A5F">My Binder</text>
    <rect x="236" y="240" width="120" height="8" rx="4" fill="#4C6A8F"/>
    <rect x="236" y="258" width="80" height="8" rx="4" fill="#4C6A8F"/>
  </g>
  <!-- question card -->
  <g transform="rotate(5 380 300)">
    <rect x="330" y="262" width="110" height="66" rx="12" fill="#FBF6EE" stroke="#B45309" stroke-width="2.5"/>
    <text x="385" y="306" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="34" font-weight="800" fill="#B45309">?</text>
  </g>
</svg>
